<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set NBA Planner</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b1a; --muted: #6b6862; --line: #e4e1db;
  --accent: #5b3fd1; --accent-ink: #ffffff; --good: #1f8a4c; --warn: #b26a00; --bad: #b3261e;
  --chip: #ece9e3; --star: #c28a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141317; --card: #1e1d23; --ink: #f1eff4; --muted: #a39fab; --line: #2f2d36;
    --accent: #9b85ff; --accent-ink: #141317; --good: #4cc27f; --warn: #e3a33b; --bad: #ff7a70;
    --chip: #2a2831; --star: #f0c040;
  }
}
:root[data-theme="dark"] {
  --bg: #141317; --card: #1e1d23; --ink: #f1eff4; --muted: #a39fab; --line: #2f2d36;
  --accent: #9b85ff; --accent-ink: #141317; --good: #4cc27f; --warn: #e3a33b; --bad: #ff7a70;
  --chip: #2a2831; --star: #f0c040;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
header { padding: 18px 0 8px; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; display: flex; gap: 6px; }
nav button { flex: 1; border: 0; border-radius: 10px; padding: 9px 4px; background: var(--chip); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 600; }
nav button.on { background: var(--accent); color: var(--accent-ink); }
.paliers { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
.paliers button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
.paliers button.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.big { font-size: 26px; font-weight: 700; }
.pct-good { color: var(--good); } .pct-mid { color: var(--warn); } .pct-low { color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.stars { color: var(--star); font-weight: 600; white-space: nowrap; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.badge.up { color: var(--good); } .badge.down { color: var(--bad); } .badge.hot { color: var(--accent); font-weight: 600; }
.plist .pl { padding: 9px 0; border-top: 1px solid var(--line); }
.plist .pl:first-child { border-top: 0; }
.num { text-align: right; white-space: nowrap; }
.num b { font-size: 16px; }
button.act { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
  padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; }
button.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.icon { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; line-height: 1; flex: 0 0 auto; }
input[type=search], input[type=password] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.filters button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
  padding: 5px 11px; font: inherit; font-size: 13px; }
.filters button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
table.pal { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.pal td { padding: 4px 0; border-top: 1px solid var(--line); }
.warn { color: var(--warn); font-size: 13px; margin-top: 6px; }
.hidden { display: none; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.5; }
.slot-empty { color: var(--muted); font-style: italic; padding: 8px 0; border-top: 1px solid var(--line); }
.tap { cursor: pointer; }
.tap .name::after { content: " ›"; color: var(--muted); font-weight: 400; }
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: none; }
#sheet.open { display: block; }
#sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto;
  background: var(--bg); border-radius: 18px 18px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto; }
#sheet h2 { font-size: 18px; margin: 0; }
#sheet h3 { font-size: 14px; margin: 16px 0 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 4px 4px 0; }
table.t td { padding: 5px 4px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; }
.formula { font-size: 13px; color: var(--muted); margin-top: 4px; }
.src { font-size: 11.5px; color: var(--muted); }
#upd { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; }
#upd.busy { opacity: .85; }
#upd.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor;
  border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.updbar { margin-top: 6px; font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--chip); }
.updbar.busy { color: var(--accent); } .updbar.ok { color: var(--good); } .updbar.err { color: var(--bad); }
.srcpill { display: inline-block; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 0 6px; margin-top: 2px; }
.srcpill.books { background: var(--accent); color: var(--accent-ink); }
.srcpill.hist { background: var(--chip); color: var(--muted); }
nav { overflow-x: auto; scrollbar-width: none; }
nav button { font-size: 12.5px; white-space: nowrap; padding: 9px 8px; flex: 1 0 auto; }
</style>
</head>
<body>
<header class="row">
  <div class="grow"><h1>Set NBA Planner</h1>
    <div class="sub" id="meta"></div>
    <div class="sub" id="upd-status"></div></div>
  <button class="act" id="upd">Mettre à jour</button>
</header>
<div class="paliers" id="paliers"></div>
<nav id="tabs">
  <button data-tab="teams" class="on">Équipes</button>
  <button data-tab="mine">Mon équipe</button>
  <button data-tab="players">Joueurs</button>
  <button data-tab="games">Matchs</button>
  <button data-tab="bilan">Bilan</button>
  <button data-tab="method">Méthode</button>
</nav>
<main>
  <section id="teams"></section>
  <section id="mine" class="hidden"></section>
  <section id="players" class="hidden"></section>
  <section id="games" class="hidden"></section>
  <section id="bilan" class="hidden"></section>
  <section id="method" class="hidden"></section>
</main>
<div id="sheet"><div class="panel" id="sheetbody"></div></div>
<footer>
  Lecture seule : rien n'est envoyé à Sorare. Sources : API publique Sorare, ESPN, RotoWire, Pinnacle, Bovada.
  Projections = estimations, pas des garanties. Probabilités par simulation (écart final tiré par match,
  minutes ajustées au blowout, rythme selon le total).
</footer>
<script>
const D = /*__DATA__*/null;
const P = D.players, byId = Object.fromEntries(P.map(p => [p.id, p]));
const G = Object.fromEntries(D.games.map(g => [g.key, g]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let target = store.get("target", D.defaultTarget);
if (!D.targets.includes(target)) target = D.defaultTarget;
let mine = store.get("mine", []).filter(id => byId[id]);
let nightFilter = "all", query = "";
let playerSort = store.get("psort", "star");
let starFilter = "all";

const fmtP = x => x >= 0.995 ? "99 %" : x < 0.005 ? "<1 %" : Math.round(x * 100) + " %";
const pClass = x => x >= 0.25 ? "pct-good" : x >= 0.1 ? "pct-mid" : "pct-low";
const stars = s => s.toFixed(1).replace(".0", "") + "★";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const palierOf = t => D.targets.indexOf(t) + 1;

// Ce que veut dire chaque tag (infobulle, fiche joueur, glossaire).
const TAGS = [
  ["props", "props +12 % vs historique",
   "Deux estimations du même joueur : l'une tirée des cotes Bovada de ce soir (retenue), l'autre de son historique (production par minute sur ses 10 derniers matchs, ajustée au match). +12 % = les cotes attendent 12 % de points Sorare en plus que l'historique. Les cotes voient ce que l'historique ignore : coéquipier absent, adversaire faible, changement de rôle. Au-delà de ±25 %, c'est un vrai signal : sur nos 2 premières nuits, les écarts forts allaient dans le bon sens. Le détail stat par stat est dans sa fiche."],
  ["back-to-back", "back-to-back",
   "Son équipe a joué la veille. Risque de minutes réduites ou de repos ; déjà dans les cotes quand il y a des props."],
  ["PROMU", "PROMU titulaire",
   "Titulaire probable ce soir selon RotoWire alors qu'il joue d'habitude moins de 24 min : ses minutes sont estimées sur ses 3 matchs les plus longs. Souvent une bonne affaire en étoiles."],
  ["banc", "banc, joue 40 % des matchs",
   "Fin de banc : pas titulaire et moins de 20 min d'habitude. Il n'entre pas à tous les matchs ; sa chance de jouer = part de ses 10 derniers matchs où il est entré."],
  ["ESPN Day-To-Day", "ESPN Day-To-Day",
   "Blessure légère signalée par ESPN, décision le jour du match. ESPN ne donne pas de %, et RotoWire ne publie les compos que le soir même : on compte 60 % de chances de jouer. Ce 60 % est une hypothèse, pas encore mesurée (aucun cas dans les bilans pour l'instant). Le soir du match, le % de RotoWire le remplace dès qu'il paraît."],
  ["ESPN Out", "ESPN Out", "Annoncé absent par ESPN : compté 0 %."],
  ["Sorare OUT", "Sorare OUT", "Blessure OUT dans les données Sorare : compté 0 %."],
  ["RotoWire", "RotoWire Ques",
   "Dans la liste des incertains de RotoWire pour ce soir. On prend le % affiché par RotoWire ; sans %, Prob (probable) = 85 %, Ques (incertain) = 50 %, Doubt (douteux) = 20 %, Out ou OFS (absent) = 0 %."],
  ["joue", "joue 60 %",
   "Probabilité qu'il joue. On prend la première source disponible : 1. le % de RotoWire le soir même (titulaires et incertains) ; 2. le statut RotoWire sans % (Prob 85 %, Ques 50 %, Doubt 20 %, Out 0 %) ; 3. ESPN : Out 0 %, Day-To-Day 60 % ; 4. Sorare : OUT 0 % ; 5. fin de banc : part de ses 10 derniers matchs où il est entré ; 6. sinon 100 %. Dans le reste des simulations, il marque 0 point. Sa fiche dit quelle source a servi."],
  ["carte", "carte +10 %",
   "Bonus de ta carte (Shiny +5 %, Holo +10 %, variante +15 %), déjà appliqué au score affiché. Ne pas surpondérer : 40 pts à 0 % valent mieux que 30 pts à +15 %."],
];
const tagInfo = r => (TAGS.find(([k]) => r.startsWith(k)) || [0, 0, ""])[2];

function badges(p) {
  const out = [];
  for (const r of p.reasons) {
    let cls = "";
    if (r.startsWith("PROMU")) cls = "hot";
    else if (r.startsWith("props")) cls = r.includes("+") ? "up" : "down";
    else if (r.includes("Out") || r.includes("Day") || r.includes("RotoWire")) cls = "down";
    out.push(`<span class="badge ${cls}" title="${esc(tagInfo(r))}">${esc(r)}</span>`);
  }
  if (p.pct < 1) out.push(`<span class="badge down" title="${esc(tagInfo("joue"))}">joue ${Math.round(p.pct * 100)} %</span>`);
  if (p.bonus > 0) out.push(`<span class="badge" title="${esc(tagInfo("carte"))}">carte +${Math.round(p.bonus * 100)} %</span>`);
  return out.length ? `<div class="badges">${out.join("")}</div>` : "";
}

// ---- Simulation (même modèle que le script Python) ----
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function bucket(m) { const b = D.calib.buckets; for (let i = 0; i < b.length; i++) if (m >= b[i][0] && m < b[i][1]) return i; return b.length - 1; }
function simulate(team, n) {
  const hits = Object.fromEntries(D.targets.map(t => [t, 0]));
  const keys = [...new Set(team.map(p => p.game))];
  const league = D.calib.league_team_pts, slope = D.calib.pace_slope;
  let sum = 0;
  for (let s = 0; s < n; s++) {
    const margin = {};
    for (const k of keys) margin[k] = Math.abs(gauss() * D.sigmaMargin - G[k].spreadUsed);
    let total = 0;
    for (const p of team) {
      if (Math.random() > p.pct) continue;
      const g = G[p.game];
      const tp = p.home ? g.homePts : g.awayPts;
      const pace = 1 + slope * (tp / league - 1);
      const ratio = D.calib.minutes[p.role][bucket(margin[p.game])];
      const m = Math.min(48, Math.max(0, p.estMin * ratio + gauss() * p.sdMin));
      total += p.rates[Math.floor(Math.random() * p.rates.length)] * pace * m * (1 + p.bonus) * p.scale;
    }
    sum += total;
    for (const t of D.targets) if (total >= t) hits[t]++;
  }
  const out = Object.fromEntries(D.targets.map(t => [t, hits[t] / n]));
  out.mean = sum / n;
  return out;
}
const lockOf = team => team.reduce((a, p) => (!a || p.tip < a.tip) ? p : a, null);

// ---- Rendu ----
function renderMeta() {
  const nights = [...new Set(D.games.map(g => g.night))].length;
  document.getElementById("meta").textContent =
    `Mis à jour le ${D.generated} · ${nights} soir${nights > 1 ? "s" : ""} · ${D.games.length} matchs`;
  if (!document.getElementById("upd-status").innerHTML && ghToken())
    document.getElementById("upd-status").innerHTML = `<a href="#" id="upd-set" class="src">réglage du bouton</a>`;
  document.getElementById("paliers").innerHTML = D.targets.map(t =>
    `<button data-t="${t}" class="${t === target ? "on" : ""}">Palier ${palierOf(t)} · ${t}</button>`).join("");
  const on = document.querySelector("#paliers button.on");
  if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
}

function playerLine(p, action) {
  return `<div class="pl row">
    <div class="grow tap" data-detail="${p.id}">
      <div class="name">${esc(p.name)} <span class="stars">${stars(p.stars)}</span></div>
      <div class="small muted">${p.team} ${p.home ? "vs" : "@"} ${p.opp} · ${p.when}</div>
      ${badges(p)}
    </div>
    <div class="num"><b>${p.exp.toFixed(0)}</b><div class="small muted">${(p.exp / p.stars).toFixed(1)}/★</div>
      <span class="srcpill ${p.usesProps ? "books" : "hist"}" title="${p.usesProps ? "Projection tirée des cotes Bovada" : "Pas de cotes : projection sur l'historique"}">${p.usesProps ? "cotes" : "historique"}</span></div>
    ${action || ""}
  </div>`;
}

function renderTeams() {
  const next = D.targets[D.targets.indexOf(target) + 1];
  const list = [...D.teams].sort((a, b) => b.p[target] - a.p[target]).slice(0, 8);
  document.getElementById("teams").innerHTML =
    `<p class="small muted">Les 8 équipes sous ${D.starCap}★ qui ont le plus de chances d'atteindre ${target} points. Sous chaque score : <span class="srcpill books">cotes</span> = projection tirée des bookmakers, <span class="srcpill hist">historique</span> = pas encore de cotes, projection sur ses 10 derniers matchs. Touche un joueur pour le détail ; glossaire dans Méthode.</p>` +
    list.map((t, i) => {
      const ps = t.ids.map(id => byId[id]).sort((a, b) => a.tip.localeCompare(b.tip));
      const lock = lockOf(ps);
      const st = ps.reduce((a, p) => a + p.stars, 0);
      return `<div class="card">
        <div class="row">
          <div class="grow"><span class="big ${pClass(t.p[target])}">${fmtP(t.p[target])}</span>
            <span class="muted small"> pour ${target}${next ? ` · ${fmtP(t.p[next])} pour ${next}` : ""}</span></div>
          <button class="act" data-load="${i}">Charger</button>
        </div>
        <div class="small muted">Moyenne ${t.mu.toFixed(0)} pts · ${stars(st)} · figée ${lock.when} · ${ps.filter(p => p.usesProps).length}/5 aux cotes</div>
        <div class="plist">${ps.map(p => playerLine(p)).join("")}</div>
      </div>`;
    }).join("");
  document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => {
    mine = list[+b.dataset.load].ids.slice(); store.set("mine", mine); show("mine");
  });
}

let simToken = 0;
function renderMine() {
  const el = document.getElementById("mine");
  const team = mine.map(id => byId[id]);
  const st = team.reduce((a, p) => a + p.stars, 0);
  const slots = [];
  for (let i = 0; i < 5; i++) {
    const p = team[i];
    slots.push(p ? playerLine(p, `<button class="icon" data-rm="${p.id}" aria-label="Retirer">×</button>`)
      : `<div class="slot-empty">Place libre : ajoute un joueur depuis l'onglet Joueurs</div>`);
  }
  const lock = lockOf(team);
  el.innerHTML = `<div class="card">
      <div class="row"><div class="grow"><b>Mon équipe</b>
        <div class="small muted">${stars(st)} / ${D.starCap}★${lock ? ` · figée ${lock.when}` : ""}</div></div>
        ${team.length ? `<button class="act" id="clear">Vider</button>` : ""}</div>
      ${st > D.starCap ? `<div class="warn">Plafond dépassé de ${stars(st - D.starCap)}</div>` : ""}
      <div class="plist">${slots.join("")}</div>
    </div>
    <div class="card" id="result">${team.length === 5 ? "Calcul…" : `<span class="muted">Choisis 5 joueurs pour voir tes chances.</span>`}</div>
    <div id="swaps"></div>`;
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    mine = mine.filter(id => id !== +b.dataset.rm); store.set("mine", mine); renderMine();
  });
  const c = document.getElementById("clear"); if (c) c.onclick = () => { mine = []; store.set("mine", mine); renderMine(); };
  if (team.length !== 5) return;
  const token = ++simToken;
  setTimeout(() => {
    if (token !== simToken) return;
    const r = simulate(team, 20000);
    document.getElementById("result").innerHTML = `
      <div><span class="big ${pClass(r[target])}">${fmtP(r[target])}</span>
        <span class="muted small"> de chances d'atteindre ${target} · moyenne ${r.mean.toFixed(0)} pts</span></div>
      <table class="pal">${D.targets.map(t => `<tr><td>Palier ${palierOf(t)} · ${t} pts</td>
        <td class="num ${pClass(r[t])}">${fmtP(r[t])}</td></tr>`).join("")}</table>
      <div style="margin-top:10px"><button class="act primary" id="swapbtn">Chercher un meilleur remplaçant</button></div>`;
    document.getElementById("swapbtn").onclick = () => findSwaps(team, r);
  }, 30);
}

function findSwaps(team, base) {
  const box = document.getElementById("swaps");
  box.innerHTML = `<div class="card muted">Recherche…</div>`;
  setTimeout(() => {
    const live = P.filter(p => p.pct > 0 && !team.includes(p));
    const tries = [];
    team.forEach((out, i) => {
      const rest = team.filter((_, j) => j !== i);
      const budget = D.starCap - rest.reduce((a, p) => a + p.stars, 0);
      live.filter(c => c.stars <= budget).sort((a, b) => b.exp * b.pct - a.exp * a.pct).slice(0, 12)
        .forEach(c => tries.push({ out, c, team: [...rest, c] }));
    });
    for (const t of tries) t.r = simulate(t.team, 4000);
    const best = tries.filter(t => t.r[target] > base[target] + 0.01).sort((a, b) => b.r[target] - a.r[target]).slice(0, 5);
    box.innerHTML = `<div class="card"><b>Un seul changement</b>${best.length ? best.map((t, k) => `
      <div class="pl row" style="border-top:1px solid var(--line);padding:8px 0">
        <div class="grow small"><span class="muted">${esc(t.out.name)}</span> → <b>${esc(t.c.name)}</b> ${stars(t.c.stars)}
          <div class="muted">${t.c.when}</div></div>
        <div class="num ${pClass(t.r[target])}"><b>${fmtP(t.r[target])}</b></div>
        <button class="act" data-sw="${k}">Prendre</button></div>`).join("")
      : `<div class="small muted" style="margin-top:6px">Aucun remplacement simple ne fait mieux.</div>`}</div>`;
    box.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => {
      const t = best[+b.dataset.sw]; mine = t.team.map(p => p.id); store.set("mine", mine); renderMine();
    });
  }, 30);
}

function renderPlayers() {
  const el = document.getElementById("players");
  const nights = [...new Set(P.map(p => p.night))].sort();
  // Soir US = nuit à Paris : « nuit du 14 au 15 » (deux soirs peuvent commencer le même jour à Paris).
  const chip = n => { const d = new Date(n + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
    return `nuit du ${+n.slice(8, 10)} au ${d.getUTCDate()}`; };
  const byScore = playerSort === "score";
  const q = query.trim().toLowerCase();
  const starLevels = [...new Set(P.filter(p => p.pct > 0).map(p => p.stars))].sort((a, b) => a - b);
  const list = P.filter(p => p.pct > 0 && (nightFilter === "all" || p.night === nightFilter)
      && (starFilter === "all" || p.stars === +starFilter)
      && (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase() === q))
    .sort((a, b) => byScore ? b.exp - a.exp : b.exp / b.stars - a.exp / a.stars).slice(0, 80);
  const full = mine.length >= 5;
  el.innerHTML = `<input type="search" id="q" placeholder="Rechercher un joueur ou une équipe (ex. SAS)" value="${esc(query)}">
    <div class="filters">${["all", ...nights].map(n =>
      `<button data-n="${n}" class="${n === nightFilter ? "on" : ""}">${n === "all" ? "Tous les soirs" : chip(n)}</button>`).join("")}</div>
    <div class="filters">${["all", ...starLevels].map(v =>
      `<button data-st="${v}" class="${String(v) === String(starFilter) ? "on" : ""}">${v === "all" ? "Toutes ★" : stars(v)}</button>`).join("")}</div>
    <div class="filters">${[["star", "Tri : points par étoile"], ["score", "Tri : score estimé"]].map(([k, l]) =>
      `<button data-sort="${k}" class="${k === playerSort ? "on" : ""}">${l}</button>`).join("")}</div>
    <p class="small muted">Le chiffre en gras est le score estimé s'il joue, bonus de carte compris ; dessous, les points par étoile et la source.</p>
    <div class="card plist">${list.map(p => playerLine(p, mine.includes(p.id)
      ? `<button class="icon" disabled aria-label="Déjà pris">✓</button>`
      : `<button class="icon" data-add="${p.id}" ${full ? "disabled" : ""} aria-label="Ajouter">+</button>`)).join("")}</div>`;
  const qi = document.getElementById("q");
  qi.oninput = () => { query = qi.value; renderPlayers(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { nightFilter = b.dataset.n; renderPlayers(); });
  el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { starFilter = b.dataset.st; renderPlayers(); });
  el.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { playerSort = b.dataset.sort; store.set("psort", playerSort); renderPlayers(); });
  el.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    if (mine.length < 5) { mine.push(+b.dataset.add); store.set("mine", mine); renderPlayers(); }
  });
}

const n1 = x => (Math.round(x * 10) / 10).toLocaleString("fr-FR");
const n2 = x => (Math.round(x * 100) / 100).toLocaleString("fr-FR");
const odd = a => { const s = String(a).trim(); return s.toUpperCase() === "EVEN" ? "+100" : (+s > 0 && !s.startsWith("+") ? "+" + s : s); };

  const lines = p.comps.filter(c => c.lines.length).map(c => `

    ${c.lines.map(l => `<tr><td>plus de ${n1(l.h)}</td><td class="r">${odd(l.over)} / ${odd(l.under)}</td>
      <td class="r">${Math.round(l.p * 100)} %</td></tr>`).join("")}`).join("");
  const teamPts = p.home ? g.homePts : g.awayPts;
  document.getElementById("sheetbody").innerHTML = `
    <div class="row"><div class="grow"><h2>${esc(p.name)} <span class="stars">${stars(p.stars)}</span></h2>
      <div class="small muted">${p.team} ${p.home ? "vs" : "@"} ${p.opp} · ${p.when}${p.bonus ? ` · carte ${esc(p.edition)} +${Math.round(p.bonus * 100)} %` : ""}</div></div>
      <button class="icon" id="close" aria-label="Fermer">×</button></div>
    <div class="card"><div><span class="big">${p.exp.toFixed(0)}</span>
      <span class="muted small"> pts estimés · ${(p.exp / p.stars).toFixed(1)} par étoile</span></div>
      <div class="formula">${formula}</div>
      <div class="formula">Historique seul : ${n1(p.hist)} pts${p.usesProps
        ? ` · les cotes attendent ${p.exp >= p.hist ? "+" : "−"}${Math.abs(Math.round((p.exp / p.hist - 1) * 100))} % (projection retenue : les cotes)` : ""}</div></div>
    ${(() => { const tags = [...p.reasons, ...(p.pct < 1 ? [`joue ${Math.round(p.pct * 100)} %`] : []),
        ...(p.bonus > 0 ? [`carte +${Math.round(p.bonus * 100)} %`] : [])];
      return tags.length ? `<h3>Ses tags</h3><div class="plist">${tags.map(r =>
        `<div class="pl"><span class="badge">${esc(r)}</span><div class="small" style="margin-top:3px">${esc(tagInfo(r))}</div></div>`).join("")}</div>` : ""; })()}

    <h3>Composantes du score Sorare</h3>
    ${p.usesProps ? `<div class="src">Colonne « Hist. » : ce que donnerait son historique seul pour la même stat, contexte du match inclus.
      L'écart entre les deux colonnes explique le tag props.</div>` : ""}
    <table class="t"><tr><th>Stat</th><th class="r">Estimé</th>${p.usesProps ? `<th class="r">Hist.</th>` : ""}<th class="r">Barème</th><th class="r">Pts</th></tr>
      ${p.comps.map(c => `<tr><td>${c.label}<div class="src">${esc(c.src)}</div></td><td class="r">${n2(c.val)}</td>
        ${p.usesProps ? `<td class="r muted">${p.histVals && p.histVals[c.k] !== undefined ? n2(p.histVals[c.k]) : "-"}</td>` : ""}
        <td class="r">${c.w > 0 ? "+" : ""}${n1(c.w)}</td><td class="r">${n1(c.pts)}</td></tr>`).join("")}
      <tr><td><b>Total brut</b></td><td></td>${p.usesProps ? "<td></td>" : ""}<td></td><td class="r"><b>${n1(raw)}</b></td></tr></table>
    <div class="src" style="margin-top:4px">Bonus double-double non compté (1 point au plus).</div>

    ${lines ? `<h3>Cotes Bovada utilisées</h3>
      <div class="src">Cote « plus » / cote « moins », puis probabilité « plus » une fois la marge du bookmaker retirée.
        Points : loi normale ajustée sur ces seuils. Rebonds, passes, 3 pts : loi de Poisson.</div>
      <table class="t">${lines}</table>` : `<h3>Cotes joueur</h3><div class="small muted">Pas de props publiées pour ce joueur : estimation sur l'historique.</div>`}

    <h3>Minutes</h3>
    <div class="small">${n1(p.estMin)} min estimées (écart-type ${n1(p.sdMin)}). ${esc(p.minRule)}.</div>
    <div class="src">Profil « ${p.role} » pour l'effet blowout${p.usesProps ? "" : ` : × ${n2(p.blow)} en moyenne vu le spread`}.</div>

    <h3>Va-t-il jouer ?</h3>
    <div class="small"><b>${Math.round(p.pct * 100)} %</b> · ${esc(p.pctSrc)}</div>

    <h3>Match</h3>
    <div class="small">${g.spreadHome !== null
      ? `${g.spreadHome > 0 ? g.away : g.home} favori de ${Math.abs(g.spreadHome)} pts, total ${g.total} (${esc(g.book || "")})`
      : "Pas encore de cotes : match supposé serré, total moyen de la ligue"}.
      Points attendus de ${p.team} : ${n1(teamPts)}${p.usesProps ? "" : `, d'où × ${n2(p.pace)} de rythme`}.</div>

    <h3>15 derniers matchs (score Sorare recalculé)</h3>
    <table class="t"><tr><th>Date</th><th class="r">Min</th><th class="r">Score</th></tr>
      ${p.last.map(m => `<tr><td>${m.d.split("-").reverse().slice(0, 2).join("/")}</td><td class="r">${m.min}</td>
        <td class="r">${n1(m.s)}</td></tr>`).join("")}</table>
    <div class="src" style="margin-top:6px">Source : API publique Sorare (stats officielles des matchs), barème Sorare appliqué.</div>`;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("close").onclick = closeDetail;
}

// ---- Bilan : projections figées avant match contre vrais scores ----
let bilanNight = "all";
const nightLabel = n => { const d = new Date(n + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
  return `nuit du ${n.slice(8, 10)} au ${String(d.getUTCDate()).padStart(2, "0")}/${n.slice(5, 7)}`; };
const sgn = x => (x >= 0 ? "+" : "−") + n1(Math.abs(x));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const STAT = [["pts", "Points", 1], ["tpm", "Paniers à 3", 1], ["reb", "Rebonds", 1.2], ["ast", "Passes", 1.5],
  ["stl", "Interceptions", 3], ["blk", "Contres", 3], ["tov", "Balles perdues", -2]];
const SHORT = { pts: "pts", tpm: "3pts", reb: "reb", ast: "pas", stl: "int", blk: "ctr", tov: "bp" };

function renderBilan() {
  const el = document.getElementById("bilan");
  const B = D.bilans || [];
  if (!B.length) { el.innerHTML = `<div class="card muted">Pas encore de bilan : il arrive le matin, après la première nuit enregistrée.</div>`; return; }
  if (bilanNight !== "all" && !B.some(b => b.night === bilanNight)) bilanNight = "all";
  const sel = bilanNight === "all" ? B : B.filter(b => b.night === bilanNight);
  const rows = sel.flatMap(b => b.rows), pl = rows.filter(r => r.pl);
  const err = pl.map(r => r.a - r.e), z = pl.filter(r => r.sd > 0).map(r => Math.abs(r.a - r.e) / r.sd <= 1 ? 1 : 0);
  const chips = [["all", B.length > 1 ? `Cumul (${B.length} nuits)` : "Cumul"], ...B.map(b => [b.night, nightLabel(b.night)])];

  const groups = [["Sûr (100 %)", r => r.pct >= 1], ["Probable (70 à 99 %)", r => r.pct >= 0.7 && r.pct < 1],
    ["Incertain (1 à 69 %)", r => r.pct > 0 && r.pct < 0.7], ["Annoncé absent", r => r.pct === 0]];
  const presence = groups.map(([l, f]) => { const g = rows.filter(f);
    return g.length ? `<tr><td>${l}</td><td class="r">${g.length}</td><td class="r">${fmtP(mean(g.map(r => r.pct)))}</td>
      <td class="r"><b>${fmtP(mean(g.map(r => r.pl ? 1 : 0)))}</b></td></tr>` : ""; }).join("");

  const wp = pl.filter(r => r.pr);
  const propsBetter = wp.filter(r => Math.abs(r.a - r.e) < Math.abs(r.a - r.h)).length;

  const xs = pl.filter(r => r.st);
  const stats = STAT.map(([k, l, w]) => {
    const pr = mean(xs.map(r => r.c[k] || 0)), re = mean(xs.map(r => r.st[k]));
    const ab = mean(xs.map(r => Math.abs(r.st[k] - (r.c[k] || 0))));
    return `<tr><td>${l}</td><td class="r">${n1(pr)}</td><td class="r">${n1(re)}</td><td class="r">${n1(ab)}</td>
      <td class="r">${n1(ab * Math.abs(w))}</td></tr>`; }).join("");

  // Équipes : les 8 meilleures pour le palier choisi, chaque nuit.
  const teams = sel.flatMap(b => [...b.teams].sort((a, c) => c.p[target] - a.p[target]).slice(0, 8)
    .map(t => ({ ...t, night: b.night })));
  const fin = teams.filter(t => t.score !== null);
  const teamHtml = teams.map(t => {
    const passed = t.score !== null && t.score >= target;
    return `<div class="pl row"><div class="grow"><div class="name" style="white-space:normal">${t.names.map(esc).join(", ")}</div>
      <div class="small muted">${bilanNight === "all" ? nightLabel(t.night) + " · " : ""}figée ${esc(fr_lock(t.lock))} · prévu ${fmtP(t.p[target])}</div>
      <div class="src">${t.pts.map((x, i) => `${esc(t.names[i].split(" ").slice(-1)[0])} ${x === null ? "…" : n1(x)}`).join(" · ")}</div></div>
      <div class="num">${t.score === null ? `<span class="muted small">en attente</span>` :
        `<b class="${passed ? "pct-good" : "pct-low"}">${n1(t.score)}</b><div class="small muted">${passed ? "passé" : "raté"}</div>`}</div></div>`; }).join("");

  const sorted = [...pl].sort((a, c) => Math.abs(c.a - c.e) - Math.abs(a.a - a.e));
  const dnp = rows.filter(r => !r.pl && r.pct > 0).sort((a, c) => c.pct - a.pct);
  const line = r => `<div class="pl row"><div class="grow"><div class="name">${esc(r.n)} <span class="stars">${stars(r.s)}</span></div>
      <div class="small muted">${r.t} contre ${r.o} · ${n1(r.em)} → ${r.m} min · ${r.pr ? "props" : "historique"}${r.b ? ` · carte +${Math.round(r.b * 100)} %` : ""}</div>
      <div class="src">prévu → réel : ${STAT.map(([k]) => `${SHORT[k]} ${n1(r.c[k] || 0)}→${r.st[k]}`).join(" · ")}</div></div>
      <div class="num"><b>${n1(r.a)}</b><div class="small muted">prévu ${n1(r.e)}</div>
      <div class="small ${r.a >= r.e ? "pct-good" : "pct-low"}">${sgn(r.a - r.e)}</div></div></div>`;

  el.innerHTML = `
    <div class="paliers">${chips.map(([k, l]) => `<button data-bn="${k}" class="${k === bilanNight ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="card"><b>Projection contre score réel</b>
      <div class="small muted">Dernière projection faite avant chaque match (bonus de carte compris), comparée au score marqué.</div>
      <table class="pal">
        <tr><td>Joueurs projetés / ont joué</td><td class="num">${rows.length} / ${pl.length}</td></tr>
        <tr><td>Biais (réel − prévu, en moyenne)</td><td class="num"><b>${sgn(mean(err))}</b> pts</td></tr>
        <tr><td>Écart moyen par joueur</td><td class="num"><b>${n1(mean(err.map(Math.abs)))}</b> pts</td></tr>
        <tr><td>Dans la fourchette ±1 écart-type</td><td class="num"><b>${fmtP(mean(z))}</b> <span class="small muted">(68 % attendu)</span></td></tr>
      </table>
      <div class="src" style="margin-top:6px">Biais proche de 0 : le modèle n'est ni trop optimiste ni trop prudent.
        Fourchette proche de 68 % : les probabilités d'équipe partent d'une dispersion juste.
        ${pl.length < 200 ? "Moins de 200 joueurs : à lire comme une tendance, pas une preuve." : ""}</div></div>
    <div class="card"><b>Équipes proposées par la page</b>
      <div class="small muted">Les 8 meilleures pour ${target} pts (palier ${palierOf(target)}), avec leur score réel.
        ${fin.length ? `${fin.filter(t => t.score >= target).length} sur ${fin.length} finies ont passé, ${n1(fin.reduce((s, t) => s + t.p[target], 0))} attendues d'après les probas.` : ""}</div>
      <div class="plist">${teamHtml || `<div class="muted small">Pas d'équipe enregistrée.</div>`}</div></div>
    <div class="card"><b>Qui a joué</b>
      <table class="t"><tr><th>Annoncé</th><th class="r">Joueurs</th><th class="r">Prévu</th><th class="r">Ont joué</th></tr>${presence}</table></div>
    <div class="card"><b>Props ou historique ?</b>
      ${wp.length ? `<table class="pal">
        <tr><td>Joueurs avec props</td><td class="num">${wp.length}</td></tr>
        <tr><td>Écart moyen avec les props</td><td class="num"><b>${n1(mean(wp.map(r => Math.abs(r.a - r.e))))}</b></td></tr>
        <tr><td>Écart moyen avec l'historique seul</td><td class="num"><b>${n1(mean(wp.map(r => Math.abs(r.a - r.h))))}</b></td></tr>
        <tr><td>Props plus proches du réel</td><td class="num">${propsBetter} sur ${wp.length}</td></tr></table>`
        : `<div class="small muted">Aucun joueur avec props.</div>`}</div>
    <div class="card"><b>Stat par stat</b>
      <div class="small muted">Moyenne par joueur ayant joué. Dernière colonne : l'écart moyen converti en points Sorare.</div>
      <table class="t"><tr><th>Stat</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Écart</th><th class="r">En pts</th></tr>${stats}
        <tr><td>Minutes</td><td class="r">${n1(mean(pl.map(r => r.em)))}</td><td class="r">${n1(mean(pl.map(r => r.m)))}</td>
        <td class="r">${n1(mean(pl.map(r => Math.abs(r.m - r.em))))}</td><td></td></tr></table></div>
    <div class="card"><b>Joueur par joueur</b> <span class="small muted">plus gros écarts en premier</span>
      <div class="plist">${sorted.map(line).join("")}</div></div>
    ${dnp.length ? `<div class="card"><b>N'ont pas joué</b> <span class="small muted">alors qu'on leur donnait une chance</span>
      <div class="plist">${dnp.map(r => `<div class="pl"><div class="name">${esc(r.n)} <span class="stars">${stars(r.s)}</span></div>
        <div class="small muted">prévu ${n1(r.e)} pts s'il jouait, ${fmtP(r.pct)} de chances</div>
        <div class="src">${esc(r.src)}</div></div>`).join("")}</div></div>` : ""}`;
  el.querySelector(".paliers").onclick = e => { if (e.target.dataset.bn) { bilanNight = e.target.dataset.bn; renderBilan(); } };
}
const fr_lock = iso => { const d = new Date(iso.replace("Z", ":00Z"));
  return d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" }); };

      <table class="t">
        <tr><td>Cartes, étoiles du Set, stats des matchs</td><td>API publique Sorare, sans connexion</td></tr>
        <tr><td>Calendrier, blessures (Out, Day-To-Day)</td><td>ESPN</td></tr>
        <tr><td>Compos probables du soir, incertains</td><td>RotoWire</td></tr>
        <tr><td>Spread et total des matchs</td><td>Pinnacle, sinon Bovada, ESPN, RotoWire</td></tr>
        <tr><td>Props points, rebonds, passes, 3 pts</td><td>Bovada</td></tr>
        <tr><td>Interceptions, contres, balles perdues</td><td>historique du joueur (10 derniers matchs)</td></tr>
        <tr><td>Bonus des cartes</td><td>ta galerie + barème confirmé (Shiny 5 %, Holo 10 %, variante 15 %)</td></tr>
      </table></div>
    <div class="card"><b>Comment un score est estimé</b>
      <div class="small">1. Chaque stat est estimée : par les cotes Bovada quand elles existent, sinon par la production
        par minute du joueur sur ses 10 derniers matchs × ses minutes estimées.<br>
        2. Sans cotes, on ajuste au contexte : rythme (points attendus de l'équipe) et blowout (minutes perdues
        si le match se plie). Avec cotes, le contexte est déjà dans la ligne.<br>
        3. On applique le bonus de la carte.<br>
        4. Pour une équipe, on simule 20 000 soirées : écart final tiré par match (commun aux joueurs du même match),
        minutes et production tirées dans l'historique de chacun, absences selon la probabilité de jouer.</div></div>
    <div class="card"><b>Mesuré sur les vrais matchs récents de tes joueurs</b>
      <div class="small muted">Minutes jouées / minutes habituelles selon l'écart final</div>
      <table class="t"><tr><th>Écart</th><th class="r">Titulaire</th><th class="r">Milieu</th><th class="r">Remplaçant</th></tr>
        ${labels.map((l, i) => `<tr><td>${l}</td><td class="r">${n2(c.minutes.titulaire[i])}</td>
          <td class="r">${n2(c.minutes.milieu[i])}</td><td class="r">${n2(c.minutes["remplaçant"][i])}</td></tr>`).join("")}</table>
      <div class="small" style="margin-top:6px">Rythme : +10 % de points pour l'équipe = ${n1(c.pace_slope * 10)} % de production par minute.
        Moyenne ligue : ${n1(c.league_team_pts)} pts par équipe.</div></div>
    <div class="card"><b>Hypothèses non mesurées</b>
      <table class="t">${Object.entries(D.hypotheses).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
      <div class="src" style="margin-top:6px">À recalibrer avec le suivi des soirs joués.</div></div>`;
}

function show(tab) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("hidden", s.id !== tab));
  ({ teams: renderTeams, mine: renderMine, players: renderPlayers, games: renderGames, bilan: renderBilan, method: renderMethod })[tab]();
  window.scrollTo(0, 0);
}
document.getElementById("tabs").onclick = e => { if (e.target.dataset.tab) show(e.target.dataset.tab); };
document.getElementById("paliers").onclick = e => {
  if (!e.target.dataset.t) return;
  target = +e.target.dataset.t; store.set("target", target); renderMeta();
  const cur = document.querySelector("#tabs button.on").dataset.tab; show(cur);
};

// ---- Bouton « Mettre à jour » : lance le calcul sur GitHub, puis recharge la page ----
// Le jeton reste dans ce navigateur (localStorage) ; il n'est jamais dans le dépôt ni dans la page publiée.
const GH_REPO = "Tiroflan/sorare-set-nba", GH_WF = "update.yml";
const GH_ACTIONS = `https://github.com/${GH_REPO}/actions/workflows/${GH_WF}`;
const ghToken = () => store.get("ghToken", "");
const setUpd = t => { const el = document.getElementById("upd-status"); el.className = "updbar ok"; el.innerHTML = t; };
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}${path}`, { ...opts, headers: {
    Accept: "application/vnd.github+json", Authorization: `Bearer ${ghToken()}`, ...(opts.headers || {}) } });
  if (!r.ok && r.status !== 204) throw new Error(r.status === 401 || r.status === 403
    ? "jeton refusé ou expiré" : `GitHub a répondu ${r.status}`);
  return r.status === 204 ? null : r.json();
}
// Retour visuel : texte du bouton + bandeau sous le titre.
const updBtn = () => document.getElementById("upd");
function updState(label, msg, kind = "busy") {
  const b = updBtn();
  b.textContent = label;
  b.classList.toggle("busy", kind === "busy");
  b.disabled = kind === "busy";
  const el = document.getElementById("upd-status");
  el.className = msg ? `updbar ${kind}` : "sub";
  el.innerHTML = msg || "";
}
const updIdle = () => updState("Mettre à jour", "", "idle");
let polling = false;

// Suit le calcul GitHub le plus récent lancé après `since`, jusqu'à la publication.
async function follow(since) {
  if (polling) return;
  polling = true;
  const t0 = since;
  const tick = async () => {
    try {
      const runs = (await gh(`/actions/workflows/${GH_WF}/runs?per_page=5`)).workflow_runs || [];
      const run = runs.find(r => Date.parse(r.created_at) >= since - 60000);
      const min = Math.max(0, Math.floor((Date.now() - t0) / 60000));
      if (!run || run.status !== "completed") {
        const step = !run || run.status === "queued" ? "en file d'attente chez GitHub" : "calcul en cours";
        updState(`En cours · ${min} min`, `⏳ ${step}, ${min} min écoulée${min > 1 ? "s" : ""} sur 3 à 5. Tu peux fermer la page, le calcul continue.`);
        return setTimeout(tick, 10000);
      }
      if (run.conclusion === "cancelled") {  // remplacé par un lancement plus récent : on suit celui-là
        const newer = runs.find(r => Date.parse(r.created_at) > Date.parse(run.created_at));
        if (newer) { since = Date.parse(newer.created_at); return setTimeout(tick, 5000); }
      }
      if (run.conclusion !== "success") {
        polling = false;
        updState("Réessayer", `✕ Le calcul a échoué (${esc(run.conclusion)}). <a href="${run.html_url}">Voir sur GitHub</a>`, "err");
        return;
      }
      let left = 45;
      const count = () => {
        updState(`Publication · ${left} s`, `✓ Calcul fini. Publication de la page, rechargement dans ${left} s…`);
        if (left-- <= 0) { store.set("updDone", Date.now()); location.href = location.pathname + "?t=" + Date.now(); }
        else setTimeout(count, 1000);
      };
      count();
    } catch (e) {
      polling = false;
      updState("Réessayer", `✕ ${esc(e.message)}. <a href="${GH_ACTIONS}">Voir sur GitHub</a>`, "err");
    }
  };
  tick();
}

async function launchUpdate() {
  updState("Lancement…", "⏳ Envoi de la demande à GitHub…");
  try {
    const since = Date.now() - 5000;
    await gh(`/actions/workflows/${GH_WF}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) });
    updState("En cours · 0 min", "✓ Demande reçue par GitHub. Le calcul démarre (3 à 5 min).");
    setTimeout(() => follow(since), 4000);
  } catch (e) {
    updState("Réessayer", `✕ Échec : ${esc(e.message)}. <a href="${GH_ACTIONS}">Lancer depuis GitHub</a>`, "err");
  }
}

// À l'ouverture : un calcul est-il déjà en cours (lancé ici, sur l'autre appareil ou par l'horaire) ?
async function resumeIfRunning() {
  const done = store.get("updDone", 0);
  if (done && Date.now() - done < 120000) {
    store.set("updDone", 0);
    updState("Mettre à jour", `✓ Page à jour : ${esc(D.generated)}.`, "ok");
    setTimeout(updIdle, 8000);
  }
  if (!ghToken()) return;
  try {
    const runs = (await gh(`/actions/workflows/${GH_WF}/runs?per_page=1`)).workflow_runs || [];
    if (runs[0] && runs[0].status !== "completed") follow(Date.parse(runs[0].created_at));
  } catch (e) { /* silencieux à l'ouverture */ }
}

function tokenSetup() {
  document.getElementById("sheetbody").innerHTML = `
    <div class="row"><div class="grow"><h2>Mettre à jour la page</h2></div>
      <button class="icon" id="close" aria-label="Fermer">×</button></div>
    <div class="card small">
      <b>Sans réglage</b> : <a href="${GH_ACTIONS}">ouvre GitHub</a>, puis « Run workflow ». La page se met à jour en 3 à 5 min.
    </div>
    <div class="card small"><b>En un bouton</b> (à faire une fois sur ce téléphone) :
      <ol style="padding-left:18px;margin:6px 0">
        <li><a href="https://github.com/settings/personal-access-tokens/new">Crée un jeton GitHub « fine-grained »</a>.</li>
        <li>Repository access : <b>Only select repositories</b>, puis <b>sorare-set-nba</b>.</li>
        <li>Permissions : <b>Actions</b>, en <b>Read and write</b>. Rien d'autre.</li>
        <li>Durée : 90 jours par exemple. Génère, copie, colle ci-dessous.</li>
      </ol>
      <input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">
      <div class="src" style="margin:6px 0">Le jeton reste dans ce navigateur, nulle part ailleurs. Il ne peut que lancer
        ou lire les calculs de ce dépôt. Pour l'effacer : « Oublier le jeton » ci-dessous.</div>
      <div class="row"><button class="act primary" id="tok-save">Enregistrer et lancer</button>
        ${ghToken() ? `<button class="act" id="tok-del">Oublier le jeton</button>` : ""}</div>
    </div>`;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("close").onclick = closeDetail;
  document.getElementById("tok-save").onclick = () => {
    const v = document.getElementById("tok").value.trim();
    if (!v) return;
    store.set("ghToken", v); closeDetail(); launchUpdate();
  };
  const del = document.getElementById("tok-del");
  if (del) del.onclick = () => { store.set("ghToken", ""); closeDetail(); setUpd("Jeton oublié."); };
}
document.getElementById("upd").onclick = () => ghToken() ? launchUpdate() : tokenSetup();
resumeIfRunning();
document.getElementById("upd").oncontextmenu = e => { e.preventDefault(); tokenSetup(); };

renderMeta(); show("teams");
document.addEventListener("click", e => { if (e.target.id === "upd-set") { e.preventDefault(); tokenSetup(); } });
</script>
