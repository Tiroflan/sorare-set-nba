name: Mise à jour de la page

on:
  schedule:
    # Heures UTC. Paris = UTC+1 en hiver : 10h, 16h, 20h, 22h, 23h, 23h30, 00h, 00h30 (+17 min).
    # Minutes décalées de l'heure pile : GitHub y retarde ou saute moins les passages.
    # 6h47 UTC = 7h47 à Paris : bilan de la nuit dès que les matchs de la côte Ouest sont finis,
    # même PC en veille (la routine Claude du matin le lit ensuite).
    # GitHub retarde ou saute souvent ses déclenchements programmés (jusqu'à 3 h le 19/11) :
    # trois essais pour avoir le bilan avant 9 h.
    - cron: "47 5,6,7 * * *"
    - cron: "17 9,15,19,21 * * *"
    - cron: "17,47 22,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SORARE_SLUG: mrpropre-df54316e-2166-4431-9042-a68f901b1132

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les données des passages précédents
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Calculer et générer la page
        run: python src/update_all.py "$SORARE_SLUG" --nuits 2
      - name: Garder le journal des projections dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Journal des projections"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
